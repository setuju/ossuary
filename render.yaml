services:
  - type: web
    name: ossuary-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: pNInz6obpgDQGcFmaJgB
      - key: BACKBOARD_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: IP2WHOIS_API_KEY
        sync: false
      - key: WHOISXMLAPI_API_KEY
        sync: false
      - key: DISABLE_ELEVENLABS
        value: "true"
